# Stack complet du Cloud Temple Calculator, sur le modèle du Cloud-Temple/starter-kit :
#
#   Internet → waf (Caddy + Coraza, seul port publié) → frontend (nginx)
#            → backend (FastAPI) → database (PostgreSQL)
#
#   cp .env.example .env   # puis renseigner les secrets
#   docker compose up -d --build
#   → application accessible sur http://localhost:8088 (WAF_PORT)
#
# Seul le service `waf` publie un port. Les autres ne sont joignables que sur
# le réseau interne du compose. Déploiement : voir README.md, section « Déploiement ».
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CALCULATOR_POSTGRES_USER:-calculator}
      POSTGRES_PASSWORD: ${CALCULATOR_POSTGRES_PASSWORD:?Définir CALCULATOR_POSTGRES_PASSWORD dans .env ou l'environnement}
      POSTGRES_DB: ${CALCULATOR_POSTGRES_DB:-calculator}
    volumes:
      - calculator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # Host = nom du service database sur le réseau compose.
      CALCULATOR_POSTGRES_HOST: database
      CALCULATOR_POSTGRES_PORT: 5432
      CALCULATOR_POSTGRES_USER: ${CALCULATOR_POSTGRES_USER:-calculator}
      CALCULATOR_POSTGRES_PASSWORD: ${CALCULATOR_POSTGRES_PASSWORD:?Définir CALCULATOR_POSTGRES_PASSWORD dans .env ou l'environnement}
      CALCULATOR_POSTGRES_DB: ${CALCULATOR_POSTGRES_DB:-calculator}
      CALCULATOR_SOURCE: db
      # Mode partenaire (remise catalogue) autorisé pour ce déploiement : yes/no.
      # Défaut « no » = prix publics. Fait autorité serveur (cf. quote.py).
      CALCULATOR_VIEW_PARTNER: ${CALCULATOR_VIEW_PARTNER:-no}
      # Barème engagement→% (donnée métier INTERNE). Format "mois:pct,mois:pct".
      # Valeurs définies dans .env (hors dépôt public) ; défaut VIDE ici exprès.
      # N'a d'effet qu'en mode partenaire.
      CALCULATOR_ENGAGEMENT_DISCOUNT_SCALE: ${CALCULATOR_ENGAGEMENT_DISCOUNT_SCALE:-}
      # 900 s = 15 min. Mettre 0 pour désactiver la synchro automatique.
      CALCULATOR_SYNC_POLL_INTERVAL_SECONDS: ${CALCULATOR_SYNC_POLL_INTERVAL_SECONDS:-900}
    depends_on:
      database:
        condition: service_healthy
    # Pas de port publié : l'API n'est jointe que par `frontend` (réseau interne).
    # Décommenter pour un accès direct en debug :
    # ports:
    #   - "8001:8001"
    expose:
      - "8001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    # Pas de port publié : joint uniquement par le WAF (réseau interne).
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy

  # WAF — Caddy + Coraza OWASP CRS + rate limiting (repris du starter-kit).
  # Seule porte d'entrée publique. Production TLS directe : SITE_ADDRESS=<domaine>
  # dans .env et publier 80/443 (cf. README, « Déploiement »).
  waf:
    build: ./waf
    restart: unless-stopped
    ports:
      - "${WAF_PORT:-8088}:8082"
    volumes:
      - ./waf/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8082}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    healthcheck:
      # Sonde interne du WAF (port 8081, non publié) : WAF → nginx → backend.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  calculator_pgdata:
  caddy-data:
