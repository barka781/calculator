<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calculateur Cloud Temple pour composer et chiffrer une architecture cloud."
    />
    <title>Cloud Temple Calculator</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- A4 (RGAA) : région live permanente, HORS #app (qui est ré-rendu en entier).
         Une région live doit préexister à ses mises à jour pour être annoncée. -->
    <div id="sr-announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <!-- Config runtime (origine de l'API) chargée avant app.js. Voir config.js. -->
    <script src="./config.js"></script>
    <script src="./src/offline-data.js"></script>
    <script src="./src/quote-core.js"></script>
    <script defer src="./src/app.js"></script>
  </body>
</html>
