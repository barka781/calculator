# Nginx : sert la SPA statique + reverse-proxy de l'API vers le service `backend`.
# Placé derrière le WAF (service `waf`) : il n'est pas exposé directement.
# Tout est servi depuis une seule origine → pas de CORS, pas d'URL d'API à
# configurer côté client (cf. location /config.js).

upstream calculator_api {
    server backend:8001;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité (CSP, HSTS, X-Frame-Options…) : posés par le WAF
    # (waf/Caddyfile), seule porte d'entrée publique. Ne pas les dupliquer ici.
    # Anti-cache : revalidation systématique côté navigateur (via ETag/Last-Modified
    # déjà émis). « no-cache » n'interdit pas le stockage : un asset inchangé répond
    # 304 (pas de re-téléchargement du volumineux snapshot), mais tout rebuild change
    # le mtime → la version fraîche est servie. Corrige l'incident 2026-06-29 où un
    # onglet ouvert resservait l'ancien CSS/JS après un rebuild.
    add_header Cache-Control "no-cache" always;

    # Compression des réponses textuelles (catalogue volumineux).
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Configuration runtime injectée : l'API est sur la même origine que le front.
    # Shadow le fichier statique config.js (neutre, utilisé seulement en dev).
    location = /config.js {
        default_type application/javascript;
        # Cache-Control hérité du niveau serveur (no-cache) : pas de doublon ici.
        return 200 "window.CALCULATOR_API_BASE = window.location.origin;\n";
    }

    # Synchro du catalogue : déclenchable sans authentification côté backend,
    # jamais appelée par l'interface. Refusée ici en plus du WAF (défense en
    # profondeur) ; la synchro périodique tourne dans le backend, sans nginx.
    location ^~ /api/sync/ {
        return 404;
    }

    # API : relais vers le backend FastAPI (chemin /api/* préservé).
    location /api/ {
        proxy_pass http://calculator_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        # Exports (xlsx/pdf/html) en flux : pas de mise en tampon.
        proxy_buffering off;
    }

    # Sonde de santé exposée par le backend.
    location = /health {
        proxy_pass http://calculator_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA : tout le reste retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
